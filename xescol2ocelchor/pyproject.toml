[project]
name = "xescol2ocelchor"
version = "0.1.0"
description = "Convert XES collaborative event logs to OCEL 2.0 choreography event logs"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "jsonschema>=4.0",
]

[project.scripts]
xescol2ocelchor = "xescol2ocelchor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xescol2ocelchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/xescol2ocelchor"]
branch = true

[tool.coverage.report]
show_missing = true
