[project]
name = "ocelchormodel-rad"
version = "0.1.0"
description = "RAD-inspired hierarchy-aware BPMN choreography discovery from OCEL 2.0 choreography logs"
license = { text = "MIT" }
requires-python = ">=3.10"
# NOTE: pm4py is added at M2 (discovery). It is pinned there for the basic
# inductive miner (no noise filtering); kept out of M1 so the reader/typing/
# hierarchy/paths layer installs without the heavy scientific stack.
dependencies = [
    "ocelchorvalidator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
ocelchormodel-rad = "ocelchormodel_rad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocelchormodel_rad"]

[tool.uv.sources]
ocelchorvalidator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
